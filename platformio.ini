[platformio]
; 独立构建目录：避免复用旧对象时触发删除操作
build_dir = .pio/build2

[env:xiaomiao]
platform = espressif32
board = esp32dev
framework = arduino

board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB

upload_speed = 460800
monitor_speed = 115200

build_flags =
    -Os
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -ffunction-sections
    -fdata-sections

build_unflags =
    -Werror=all
